name: Release

# Runs on every push to main. When unreleased changesets are present, the action opens a
# "Version Packages" PR. Merging that PR (another push to main) publishes to npm and creates
# the matching GitHub Release.
on:
  push:
    branches:
      - main

# Avoid two releases racing if pushes land back to back.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create release commits, tags, and GitHub Releases
  pull-requests: write # open / update the Version Packages PR
  id-token: write # mint the OIDC token npm uses to attach provenance

jobs:
  # Gate the publish on the same suite PRs run, so a red one never reaches npm.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the GitHub changelog generator can link commits.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # setup-node writes the auth-token .npmrc that `changeset publish` reads, and provides a
      # recent npm CLI for provenance generation.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # v2 learns what was published from the file the CLI writes to CHANGESETS_OUTPUT, which the
      # scripts inherit; v1 parsed "New tag:" from stdout, which @changesets/cli 3 no longer prints,
      # so it published and pushed no tags and created no GitHub Releases.
      - name: Create Release PR or publish
        uses: changesets/action@v2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
