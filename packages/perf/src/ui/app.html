            No stylesheet here on purpose. This shell was the ONLY one of the six comparison arms that
            shipped any CSS, and `.danger { background: #fee; }` was the whole of the `select row`
            column: Blink builds its style invalidation sets from the stylesheets, so changing a class
            no rule mentions costs nothing after the write. The five unstyled arms recalculated no
            style and repainted nothing; this one did both, and read as 4.5x slower for it.

            The rules now live in `SHELL_CSS` in ~/code/abide-perf-compare.ts, which installs them
            into every arm alike. Nothing here needs them to be correct — the pages are measured, not
            looked at.
        -->
