# The root's `[test] preload`, repeated for the reason `packages/example/bunfig.toml` states: a bunfig
# shadows rather than merges, so a `bun test` typed in this package had no DOM and no `.abide` loader —
# six of its eight cases failed, and the pages this app exists to measure could not be loaded at all.
#
# `packages/example/test/preloaded.test.ts` is what holds every copy of this list to the same answer.
[test]
preload = ["../abide-kit/internal/happydom.ts", "../abide/compiler/preload.ts"]
