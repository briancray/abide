<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!--
            THE TYPEFACES, AND NOTHING ELSE. The stylesheet is not linked here: a page declares
            the stylesheet it depends on (34.5) and `abide start` links what the build bundled
            (38.24), so a `<link>` written here would be a second, stale answer to that.
            The three families are BRAND's, loaded the way `scripts/buildDocs.ts` loads them.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
        />
        <!--
            THE DOCS APP'S OWN CLIENT CODE, which is not the app's runtime: the scroll spy and
            the example cards are imperative work over nodes a page painted, and the hook they
            want (32.9) is not emitted yet. `assets/docs.js` says what happens when it is.
        -->
        <script type="module" src="/docs.js"></script>
    </head>
    <body class="has-toc"></body>
</html>
