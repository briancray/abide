<h1>Settings</h1>
<button data-theme>Theme: <span>dark</span></button>
<p class="hint">Written on every production, read back at construction.</p>
<p class="tip">Dark on the FIRST frame, with no light one before it. A store ANSWERS BEFORE the
initial value, so <code>'light'</code> is what a miss falls back to rather than what this starts
at — and a synchronous <code>get</code> is not a load, so nothing was pending.</p>
