# The pages are Tailwind-styled, and this is where the app says so: `abide build` and `abide dev`
# read `[serve.static] plugins` — Bun's own spelling — and bundle the client lane with them, so the
# `@import "tailwindcss"` in `app.css` is compiled by the app's own dependency.
#
# Declared HERE rather than in the root bunfig because the plugin is resolved relative to the app root
# that names it, and `bun-plugin-tailwind` is an example dependency — abide itself has no styling and
# must not acquire one by being in the same repo.
#
# `../abide/compiler/plugin.ts` is deliberately absent: the `.abide` loader is in the lane already,
# for every app, and an app naming it again would be the same plugin set up twice.
[serve.static]
plugins = ["bun-plugin-tailwind"]

# The same two preloads the root `bunfig.toml` names, because a bunfig SHADOWS rather than merges:
# bun reads the one at the directory it was invoked from and no other, so this file existing at all —
# it exists for the plugin above — is what took the DOM and the `.abide` loader away from a `bun test`
# typed inside this package. What that looked like was 19 failures reading `document is not defined`
# and `has no default export`, none of which name the cause.
#
# Two declarations of one list, and the alternative was worse: dropping this file moves a client
# plugin into the framework's own bunfig, and leaving it out leaves a trap whose symptom points
# everywhere except at it. `test/preloaded.test.ts` is what keeps the two in step.
[test]
preload = ["../harness/internal/happydom.ts", "../abide/compiler/preload.ts"]
