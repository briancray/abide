# The docs app's own bundler plugins, read by `abide build` and `abide dev` (RULEBOOK 38.43) — the
# setup `/templates/scope-styles-to-a-component` teaches, dogfooded.
[serve.static]
plugins = ["bun-plugin-tailwind"]

# A test imports the docs app's `.abide` files as the components they compile to (RULEBOOK 38.109) —
# the setup `/ship/call-your-app-from-a-test` teaches. Read only by `bun test` run from this directory.
[test]
preload = ["@abide/abide/test"]
