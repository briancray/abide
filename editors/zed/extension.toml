id = "abide"
name = "abide"
description = "`.abide` files: markup, TypeScript and CSS highlighting, and what `abide check` finds, as you type."
version = "0.0.1"
schema_version = 1
authors = ["Brian Cray <bcrayzie@icloud.com>"]
repository = "https://github.com/briancray/abide"

[language_servers.abide]
name = "abide"
languages = ["abide"]

[language_servers.abide.language_ids]
"abide" = "abide"

# The grammar is `editors/tree-sitter-abide` in this repository, fetched by Zed at `commit`. Zed
# builds a grammar from what is committed, so a change to it lands in the editor once it is
# committed and this pins the commit.
[grammars.abide]
repository = "https://github.com/briancray/abide"
commit = "d7cd46da1e0cd523631d38d923f8bb08d1f0716f"
path = "editors/tree-sitter-abide"
