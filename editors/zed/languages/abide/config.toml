name = "abide"
grammar = "abide"
path_suffixes = ["abide"]
# The markup's comment, which is the only comment a `.abide` file has OUTSIDE a script block. Inside
# one the injected TypeScript brings its own, and Zed takes it from that layer.
block_comment = ["<!-- ", " -->"]
tab_size = 4
autoclose_before = ":\"'}]>"
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
    { start = ">", end = "</", close = false, newline = true, not_in = ["comment", "string"] },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string"] },
]

# A `.abide` template is styled with tailwind classes — `class=` is where the app's whole visual
# vocabulary lives — so the class string is opted in to the tailwind server the same way Svelte's is.
scope_opt_in_language_servers = ["tailwindcss-language-server"]

[overrides.string]
completion_query_characters = ["-"]
opt_into_language_servers = ["tailwindcss-language-server"]
